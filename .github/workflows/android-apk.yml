name: Build Android Admin APK (Tauri v2 + Rust)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Build-Tools
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Setup Rust toolchain & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile-admin/src-tauri

      - name: Install Tauri CLI v2
        run: npm install --no-save @tauri-apps/cli@^2.0.0

      - name: Initialize & Build Android APK
        working-directory: mobile-admin
        run: |
          npx tauri android init
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          fi
          npx tauri android build --apk --debug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: burak-kul-admin-apk
          path: mobile-admin/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
