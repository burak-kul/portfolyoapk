name: Build Android Admin APK (Tauri v2 + Rust)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies & Tauri CLI v2
        run: |
          npm ci || npm install
          npm install --no-save @tauri-apps/cli@^2.0.0
          ln -sf "$(pwd)/node_modules/@tauri-apps/cli/tauri.js" mobile-admin/src-tauri/tauri

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure pre-installed Android SDK & NDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$NDK_DIR" ]; then
            "$SDKMANAGER" --install "ndk;26.3.11579264"
            NDK_DIR="$ANDROID_HOME/ndk/26.3.11579264"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

      - name: Setup Rust toolchain & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile-admin/src-tauri

      - name: Initialize & Build Android APK
        working-directory: mobile-admin
        run: |
          npm run tauri -- android init --ci
          npm run tauri -- icon src-tauri/icons/icon.png
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:usesCleartextTraffic="\${usesCleartextTraffic}"/android:usesCleartextTraffic="true"/' "$MANIFEST"
          fi
          npm run tauri -- android build --apk --debug --target aarch64 --ci

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: burak-kul-admin-apk
          path: mobile-admin/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
